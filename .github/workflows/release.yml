name: 플러그인 릴리스 배포

on:
  push:
    branches:
      - main
    paths:
      - 'Urban_QGIS_Toolkit/metadata.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 버전 확인
        id: version
        run: |
          VERSION=$(grep -E '^version=' Urban_QGIS_Toolkit/metadata.txt | head -1 | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "감지된 버전: $VERSION"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "태그 v$VERSION 이 이미 존재하므로 릴리스를 건너뜁니다."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 플러그인 ZIP 빌드
        if: steps.version.outputs.exists == 'false'
        run: |
          mkdir -p dist
          zip -r "dist/Urban_QGIS_Toolkit.zip" \
            Urban_QGIS_Toolkit \
            -x '*__pycache__*' -x '*.pyc' -x '*.pyo' -x '*.DS_Store'
          ls -lh dist

      - name: ZIP 무결성 검사
        if: steps.version.outputs.exists == 'false'
        run: |
          unzip -t "dist/Urban_QGIS_Toolkit.zip" > /dev/null
          unzip -l "dist/Urban_QGIS_Toolkit.zip" \
            | grep -q 'Urban_QGIS_Toolkit/metadata.txt'
          echo "ZIP 구조 정상"

      - name: 릴리스 노트 생성
        if: steps.version.outputs.exists == 'false'
        run: |
          python - <<'PY' > release_notes.md
          import configparser
          cfg = configparser.ConfigParser()
          cfg.read('Urban_QGIS_Toolkit/metadata.txt', encoding='utf-8')
          changelog = cfg['general'].get('changelog', '').strip()
          print('## 변경 사항\n')
          print(changelog if changelog else '- 내용 없음')
          print('\n## 설치 방법\n')
          print('QGIS 메뉴 > 플러그인 > 플러그인 관리 및 설치 > 설정 > 저장소 추가에서')
          print('아래 주소를 등록하면 이후 업데이트가 자동으로 안내됩니다.\n')
          print('```')
          print('https://raw.githubusercontent.com/hgkang17/Urban-QGIS-Toolkit/main/plugins.xml')
          print('```')
          PY
          cat release_notes.md

      - name: GitHub 릴리스 생성
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/Urban_QGIS_Toolkit.zip" \
            --title "Urban QGIS Toolkit ${{ steps.version.outputs.version }}" \
            --notes-file release_notes.md \
            --target "$GITHUB_SHA"

      - name: 저장소 XML 갱신
        if: steps.version.outputs.exists == 'false'
        run: python tools/build_plugins_xml.py

      - name: XML 커밋 및 푸시
        if: steps.version.outputs.exists == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add plugins.xml
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "자동 배포: plugins.xml 을 ${{ steps.version.outputs.version }} 버전으로 갱신"
            git push origin HEAD:main
          fi
